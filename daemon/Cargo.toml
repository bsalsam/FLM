[package]
name = "flm-daemon"
version = "0.1.0"
edition = "2024"
description = "FLM (Free Linux Monitor) - daemon Linux que estende o desktop para um dispositivo Android via rede"
license = "GPL-3.0-or-later"
authors = ["Bruno S Sampaio"]

[dependencies]
anyhow = "1"
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
x11rb = { version = "0.13", features = ["shm"] }
